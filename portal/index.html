<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>My Portal | Cute Kids Academy</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/portal.css">
</head>
<body>
<header class="p-header">
  <div class="p-bar">
    <a href="/"><img class="p-logo" src="/images/logo.png" alt="Cute Kids Academy"></a>
    <span class="p-spacer"></span>
    <button class="p-link" type="button" data-lang-toggle data-i18n="nav.lang">العربية</button>
    <button class="p-link" type="button" data-signout data-i18n="nav.signout">Sign out</button>
  </div>
</header>

<main class="p-main" id="app" hidden>
  <div class="p-card">
    <h1 id="hello"></h1>
    <p class="p-sub" data-i18n="portal.soon">Your cases, accident reports and monthly rating will appear here soon.</p>
  </div>
  <div class="p-card blue">
    <h2 data-i18n="portal.children">Your children</h2>
    <div id="kids"></div>
  </div>
</main>

<script src="/js/vendor/supabase.js"></script>
<script src="/js/portal-config.js"></script>
<script src="/js/portal-logic.js"></script>
<script src="/js/portal-core.js"></script>
<script src="/js/portal-home.js"></script>
</body>
</html>
