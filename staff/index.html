<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Staff | Cute Kids Academy</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/portal.css">
</head>
<body>
<header class="p-header">
  <div class="p-bar">
    <a href="/"><img class="p-logo" src="/images/logo.png" alt="Cute Kids Academy"></a>
    <span class="p-spacer"></span>
    <button class="p-link" type="button" data-lang-toggle data-i18n="nav.lang">العربية</button>
    <button class="p-link" type="button" data-signout data-i18n="nav.signout">Sign out</button>
  </div>
</header>

<main class="p-main" id="app" hidden>
  <div class="p-card">
    <h1 id="hello"></h1>
    <p class="p-sub"><span class="pill" id="roleBadge"></span></p>
    <h2 data-i18n="staff.today">Today</h2>
    <p class="p-sub" data-i18n="staff.soon">The case queue, accident log and reports are coming next.</p>
  </div>

  <!-- Admin, manager and owner only: shown by js/staff.js -->
  <section id="people" hidden>
    <div class="p-card blue">
      <h2 data-i18n="staff.inviteparent">Invite a parent</h2>
      <div id="parentMsg" class="note hidden" role="status" aria-live="polite"></div>
      <form id="parentForm" novalidate>
        <div class="f-grid">
          <div class="f-row"><label for="pName" data-i18n="field.name">Full name</label><input id="pName" type="text" autocomplete="off" required></div>
          <div class="f-row"><label for="pEmail" data-i18n="field.email">Email</label><input id="pEmail" type="email" inputmode="email" autocomplete="off" required></div>
          <div class="f-row"><label for="pPhone" data-i18n="field.phone">Phone (optional)</label><input id="pPhone" type="tel" autocomplete="off"></div>
          <div class="f-row"><label for="pLang" data-i18n="field.language">Language</label>
            <select id="pLang"><option value="ar" data-i18n="lang.ar">Arabic</option><option value="en" data-i18n="lang.en">English</option></select></div>
        </div>
        <div class="f-row"><label data-i18n="field.children">Child or children</label><div class="checks" id="pChildren"></div></div>
        <button class="btn btn-pink" type="submit" data-i18n="staff.sendinvite">Send invitation</button>
      </form>
    </div>

    <div class="p-card blue" id="staffCard" hidden>
      <h2 data-i18n="staff.invitestaff">Add a staff member</h2>
      <div id="staffMsg" class="note hidden" role="status" aria-live="polite"></div>
      <form id="staffForm" novalidate>
        <div class="f-grid">
          <div class="f-row"><label for="sName" data-i18n="field.name">Full name</label><input id="sName" type="text" autocomplete="off" required></div>
          <div class="f-row"><label for="sEmail" data-i18n="field.email">Email</label><input id="sEmail" type="email" inputmode="email" autocomplete="off" required></div>
          <div class="f-row"><label for="sPhone" data-i18n="field.phone">Phone (optional)</label><input id="sPhone" type="tel" autocomplete="off"></div>
          <div class="f-row"><label for="sRole" data-i18n="field.role">Role</label><select id="sRole"></select></div>
          <div class="f-row"><label for="sLang" data-i18n="field.language">Language</label>
            <select id="sLang"><option value="ar" data-i18n="lang.ar">Arabic</option><option value="en" data-i18n="lang.en">English</option></select></div>
        </div>
        <div class="f-row"><label data-i18n="field.classes">Classes (optional)</label><div class="checks" id="sClasses"></div></div>
        <button class="btn btn-pink" type="submit" data-i18n="staff.sendinvite">Send invitation</button>
      </form>
    </div>

    <div class="p-card">
      <h2 data-i18n="staff.list">Accounts</h2>
      <div id="listMsg" class="note hidden" role="status" aria-live="polite"></div>
      <div class="tbl-wrap"><table class="tbl"><tbody id="people-rows"></tbody></table></div>
    </div>
  </section>
</main>

<script src="/js/vendor/supabase.js"></script>
<script src="/js/portal-config.js"></script>
<script src="/js/portal-logic.js"></script>
<script src="/js/portal-core.js"></script>
<script src="/js/staff.js"></script>
</body>
</html>
