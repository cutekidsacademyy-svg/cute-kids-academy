<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Login | Cute Kids Academy</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/portal.css">
</head>
<body>
<header class="p-header">
  <div class="p-bar">
    <a href="/"><img class="p-logo" src="/images/logo.png" alt="Cute Kids Academy"></a>
    <span class="p-spacer"></span>
    <a class="p-link" href="/" data-i18n="nav.site">Back to website</a>
    <button class="p-link" type="button" data-lang-toggle data-i18n="nav.lang">العربية</button>
  </div>
</header>

<main class="p-main">
  <div class="p-card p-auth">
    <div id="msg" class="note hidden" role="status" aria-live="polite"></div>

    <!-- Sign in -->
    <form id="signinForm" class="hidden" novalidate>
      <h1 data-i18n="login.welcome">Welcome back</h1>
      <p class="p-sub" data-i18n="login.sub">Sign in to see your child's updates.</p>
      <div class="f-row"><label for="email" data-i18n="field.email">Email</label>
        <input id="email" type="email" autocomplete="username" inputmode="email" required></div>
      <div class="f-row"><label for="password" data-i18n="field.password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-pink btn-block" type="submit" data-i18n="btn.signin">Sign in</button>
      <p style="margin-top:14px"><button class="p-link" type="button" id="toForgot" data-i18n="btn.forgot">Forgot your password?</button></p>
      <p class="p-sub" style="margin-top:10px;font-size:.9rem" data-i18n="login.noaccount">Accounts are created by the academy.</p>
    </form>

    <!-- Forgot password -->
    <form id="forgotForm" class="hidden" novalidate>
      <h1 data-i18n="login.forgot.title">Reset your password</h1>
      <div class="f-row"><label for="forgotEmail" data-i18n="field.email">Email</label>
        <input id="forgotEmail" type="email" autocomplete="username" inputmode="email" required></div>
      <button class="btn btn-pink btn-block" type="submit" data-i18n="btn.sendlink">Send me a reset link</button>
      <p style="margin-top:14px"><button class="p-link" type="button" id="toSignin" data-i18n="btn.back">Back to sign in</button></p>
    </form>

    <!-- Choose a password (from an invitation or a reset link) -->
    <form id="setForm" class="hidden" novalidate>
      <h1 data-i18n="login.set.title">Choose your password</h1>
      <p class="p-sub" data-i18n="login.set.sub">Pick a password you will remember, at least 8 characters.</p>
      <div class="f-row"><label for="newPassword" data-i18n="field.newpassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="f-row"><label for="newPassword2" data-i18n="field.confirm">Type it again</label>
        <input id="newPassword2" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="btn btn-pink btn-block" type="submit" data-i18n="btn.setpassword">Save password</button>
    </form>
  </div>
</main>

<footer class="p-foot"><a href="/privacy/" data-i18n="nav.privacy">Privacy notice</a></footer>

<script src="/js/vendor/supabase.js"></script>
<script src="/js/portal-config.js"></script>
<script src="/js/portal-logic.js"></script>
<script src="/js/portal-core.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
